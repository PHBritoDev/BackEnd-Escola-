<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Painel de Alunos</title>
</head>

<body>

    <div class="container">

        <header>
            <h1>Painel de Alunos</h1>
            <p>Demonstração de CRUD front-end/back-end (Node.js)</p>

            <button class="baixarPDF"
                onclick="window.print()"
                style="
                    margin-top: 1rem;
                    padding: 10px 20px;
                    font-weight: bold;
                    cursor: pointer;
                    border-radius: 8px;
                    border: none;
                    background: white;
                    color: var(--primary-color);
                ">
                ⬇️ Baixar PDF
            </button>
        </header>

        <main>

            <section class="form-section">
                <h2>Novo Aluno</h2>

                <form id="aluno-form">

                    <input type="hidden" id="aluno-id">

                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input
                            type="text"
                            id="nome"
                            required
                            placeholder="Ex: zé antonio pereira"
                        >
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            required
                            placeholder="Ex: paulao67@email.com"
                        >
                    </div>
   
                    </div>
                    <div class="input-group">
                        <label for="curso">Curso</label>

                        <select id="curso" required>
                            <option value="">Selecione um Curso...</option>

                            <option value="Analise do Sistemas">
                                Analise Do Sistemas
                            </option>

                            <option value="Engenharia de Software">
                                Engenharia De Software
                            </option>

                            <option value="Ciencia da Computaçao">
                                Ciencia da Computaçao
                            </option>
                        </select>

                    </div>
<div class="input-group">
    <label for="cpf">CPF</label>
    <input
        type="text"
        id="cpf"
        required
        placeholder="Ex: 909372..."
    >
</div>

<div class="input-group">
    <label for="idade">Idade</label>
    <input
        type="number"
        id="idade"
        min="1"
        max="120"
        required
        placeholder="Ex: 18"
    >
</div>

<div class="input-group">
    <label for="telefone">Telefone</label>
    <input
        type="tel"
        id="telefone"
        required
        placeholder="Ex: (61) 99999-9999"
    >
</div>
                    <div class="Form-actions">

                        <button
                            type="button"
                            class="btn-cancel"
                            id="aluno-cancel"
                            style="display: none;"
                        >
                            Cancelar Edição
                        </button>

                        <button
                            type="submit"
                            class="btn-save"
                            id="aluno-save"
                        >
                            Salvar Aluno
                        </button>

                    </div>

                </form>
            </section>

            <section class="list-section">
                <h2>Alunos Cadastrados</h2>

                <div class="table-container">
                    <table>

                       <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Curso</th>
        <th>CPF</th>
        <th>Idade</th>
        <th>Telefone</th>
        <th>Ações</th>
    </tr>
</thead>

                        <tbody id="aluno-tbody">
                        </tbody>

                    </table>
                </div>

            </section>

        </main>

    </div>


<script src="script.js"></script>


</body>

</html>
